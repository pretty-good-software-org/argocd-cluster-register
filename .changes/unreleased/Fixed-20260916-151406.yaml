kind: Fixed
body: |-
  google.golang.org/grpc moves to 1.83.2, clearing GO-2026-6348, heap exhaustion through HTTP/2 DATA frame
  fragmentation, and GO-2026-6443, a server panic on a missing authority or Host header. govulncheck did not report
  either as reachable from this module, so the bump is hygiene rather than an exposed path.
time: 2026-09-16T15:14:06+02:00
